<!doctype html><html><head><meta charset="utf-8"></head><body><canvas id="gl" width="16" height="16"></canvas>
<script type="module">
// Check V5: the film's GPU integrator (pend.js, 32-bit floats) vs the CPU reference (dp.c, 64-bit).
// probe(0): the 10,000-pendulum fan (120 deg / 120 deg, lower-arm offsets 0 ... 0.0001 deg) in float32: how many distinct
//           starting values the GPU holds, and th1, th2 of every pendulum every 0.5 s up to 30 s.
// probe(1): the flip-time map, 1080 x 1080 starts from rest over -180...180 deg, run to 60 s: flip time of every pixel.
import { PendGPU } from './pend.js';
const gl = document.getElementById('gl').getContext('webgl2');
const DEG = Math.PI / 180, DT = 1 / 1200;
function fanInit(n, w) { const a = new Float32Array(w * w * 4); for (let k = 0; k < w * w; k++) { const kk = Math.min(k, n - 1);
  a[4 * k] = 120 * DEG; a[4 * k + 1] = 120 * DEG + 1e-4 * DEG * kk / (n - 1); } return a; }
export function mapInit(M) { const a = new Float32Array(M * M * 4); for (let j = 0; j < M; j++) for (let i = 0; i < M; i++) { const k = j * M + i;
  a[4 * k] = -Math.PI + (i + 0.5) * 2 * Math.PI / M; a[4 * k + 1] = -Math.PI + (j + 0.5) * 2 * Math.PI / M; } return a; }
window.__demo = { duration: 2, fps: 1, ready: Promise.resolve(true), seek() {} };
window.__probe = t => {
  if (Math.round(t) === 0) {
    const init = fanInit(10000, 100), P = new PendGPU(gl, 100, 100, init, { dt: DT });
    const distinct = new Set(Array.from({ length: 10000 }, (_, k) => init[4 * k + 1])).size;
    const frames = [];
    for (let s = 0; s <= 60; s++) { P.advanceToTime(s * 0.5); const r = P.read(); const th = []; for (let k = 0; k < 10000; k++) th.push(r[4 * k], r[4 * k + 1]); frames.push(th); }
    return { kind: 'fan', distinct, dt: DT, every: 0.5, frames };
  }
  const M = 1080, P = new PendGPU(gl, M, M, mapInit(M), { dt: DT });
  P.advanceToTime(60, 120); const f = P.read('F'); const flip = new Array(M * M); for (let k = 0; k < M * M; k++) flip[k] = f[4 * k];
  return { kind: 'map', M, T: 60, dt: DT, flip };
};
</script></body></html>
